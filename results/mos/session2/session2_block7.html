<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening study — session 2</title>
<style>
 body{font-family:system-ui,-apple-system,sans-serif;max-width:44rem;margin:0 auto;
      padding:1.5rem;line-height:1.55;color:#111}
 .card{border:1px solid #ddd;border-radius:10px;padding:1.25rem;margin:1rem 0}
 .opt{border:1px solid #ccc;border-radius:10px;padding:.9rem;margin:.6rem 0;background:#fafafa}
 .opt b{font-size:1.05rem}
 audio{width:100%;margin-top:.4rem}
 button{font-size:1rem;padding:.55rem 1.1rem;border-radius:8px;border:1px solid #888;
        background:#f6f6f6;cursor:pointer}
 button:disabled{opacity:.45;cursor:not-allowed}
 .scale{display:flex;flex-direction:column;gap:.4rem;margin:1rem 0}
 .scale label{display:flex;align-items:baseline;gap:.6rem;border:1px solid #bbb;
              border-radius:8px;padding:.55rem .8rem;cursor:pointer}
 .scale label:has(input:checked){background:#e8f0fe;border-color:#3367d6}
 .prog{color:#666;font-size:.9rem}
 .warn{background:#fff8e1;border-color:#f0c36d}
</style></head><body>
<div id="app"></div>
<script>
const TRIALS = [{"trial_id": "t015", "file_a": "t015_A.mp3", "file_b": "t015_B.mp3"}, {"trial_id": "t032", "file_a": "t032_A.mp3", "file_b": "t032_B.mp3"}, {"trial_id": "t009", "file_a": "t009_A.mp3", "file_b": "t009_B.mp3"}, {"trial_id": "t002", "file_a": "t002_A.mp3", "file_b": "t002_B.mp3"}, {"trial_id": "t003", "file_a": "t003_A.mp3", "file_b": "t003_B.mp3"}, {"trial_id": "t012", "file_a": "t012_A.mp3", "file_b": "t012_B.mp3"}, {"trial_id": "t050", "file_a": "t050_A.mp3", "file_b": "t050_B.mp3"}, {"trial_id": "t071", "file_a": "t071_A.mp3", "file_b": "t071_B.mp3"}, {"trial_id": "t019", "file_a": "t019_A.mp3", "file_b": "t019_B.mp3"}, {"trial_id": "t028", "file_a": "t028_A.mp3", "file_b": "t028_B.mp3"}, {"trial_id": "t036", "file_a": "t036_A.mp3", "file_b": "t036_B.mp3"}, {"trial_id": "t038", "file_a": "t038_A.mp3", "file_b": "t038_B.mp3"}, {"trial_id": "t014", "file_a": "t014_A.mp3", "file_b": "t014_B.mp3"}, {"trial_id": "t064", "file_a": "t064_A.mp3", "file_b": "t064_B.mp3"}, {"trial_id": "t010", "file_a": "t010_A.mp3", "file_b": "t010_B.mp3"}, {"trial_id": "t039", "file_a": "t039_A.mp3", "file_b": "t039_B.mp3"}, {"trial_id": "t027", "file_a": "t027_A.mp3", "file_b": "t027_B.mp3"}, {"trial_id": "t049", "file_a": "t049_A.mp3", "file_b": "t049_B.mp3"}, {"trial_id": "t006", "file_a": "t006_A.mp3", "file_b": "t006_B.mp3"}, {"trial_id": "t052", "file_a": "t052_A.mp3", "file_b": "t052_B.mp3"}, {"trial_id": "t063", "file_a": "t063_A.mp3", "file_b": "t063_B.mp3"}, {"trial_id": "t042", "file_a": "t042_A.mp3", "file_b": "t042_B.mp3"}, {"trial_id": "t080", "file_a": "t080_A.mp3", "file_b": "t080_B.mp3"}, {"trial_id": "t004", "file_a": "t004_A.mp3", "file_b": "t004_B.mp3"}];
const AUDIO = "audio";
const SCALE = [
 {v:1, t:"Version A is clearly more coherent"},
 {v:2, t:"Version A is slightly more coherent"},
 {v:3, t:"About the same"},
 {v:4, t:"Version B is slightly more coherent"},
 {v:5, t:"Version B is clearly more coherent"},
];
const app=document.getElementById("app");
const code="s2-"+Math.random().toString(36).slice(2,8);
let answers={}, ms={}, i=0, t0=0;   // answers[idx] = 1..5 | 'skip'
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));
 [a[j],a[k]]=[a[k],a[j]];}return a;}
const order=shuffle(TRIALS.slice());

function intro(){
 app.innerHTML=`<h2>Listening study — part 2</h2>
 <div class="card warn"><b>Local dry run.</b> No participant data is collected here.</div>
 <div class="card">
  <p>In each trial you hear <b>two versions of the same piece of music</b>. In both, a
  short section in the middle was <b>regenerated by an AI model</b>. The surrounding
  music is identical — only the regenerated section differs.</p>
  <p>Your job: decide <b>which version's regenerated section fits better with the music
  around it</b> — in key, style, tempo and instrumentation. Listen to both before
  answering; you can replay either as often as you like.</p>
  <p><b>Before you start — set your volume.</b> Some of this audio is machine-generated
  and may sound harsh or distorted. Set a comfortable level and leave it there. If any
  comparison is uncomfortable, every trial has a <b>Skip</b> button.</p>
  <p class="prog">${order.length} comparisons, about ${Math.round(order.length*0.75)} minutes.</p>
  <button onclick="start()">Start</button></div>`;
}
function start(){ i=0; trial(); }
function trial(){
 const t=order[i];
 app.innerHTML=`<p class="prog">Comparison ${i+1} of ${order.length}</p>
 <div class="card">
  <div class="opt"><b>Version A</b>
   <audio controls preload="none" src="${AUDIO}/${t.file_a}"></audio></div>
  <div class="opt"><b>Version B</b>
   <audio controls preload="none" src="${AUDIO}/${t.file_b}"></audio></div>
  <p><b>Which version's regenerated section fits better with the surrounding music?</b></p>
  <p class="prog">Both versions share the same surrounding music — only the middle
  section differs. Judge how well that middle section matches the rest in
  <b>key, style, tempo and instrumentation</b>. Not which track you prefer, and not
  which is louder or cleaner overall.</p>
  <div class="scale">${SCALE.map(s=>`<label><input type="radio" name="p" value="${s.v}">
    <span>${s.t}</span></label>`).join("")}</div>
  <button id="bk" onclick="back()" ${i===0?'disabled':''}>Back</button>
  <button id="nx" disabled onclick="submit()">Next</button>
  <button onclick="skip()">Skip — uncomfortable</button>
 </div>`;
 t0=performance.now();
 const prev=answers[i];
 if(prev && prev!=='skip'){
   const el=document.querySelector(`input[name=p][value="${prev}"]`);
   if(el){ el.checked=true; document.getElementById("nx").disabled=false; }
 }
 document.querySelectorAll('input[name=p]').forEach(el=>el.addEventListener("change",
   ()=>{document.getElementById("nx").disabled=false;}));
}

function back(){ if(i>0){ i--; trial(); } }
function skip(){ answers[i]='skip'; i++; if(i<order.length) trial(); else done(); }
function submit(){
 const cur=document.querySelector('input[name=p]:checked'); if(!cur) return;
 answers[i]=parseInt(cur.value); ms[i]=Math.round(performance.now()-t0);
 i++; if(i<order.length) trial(); else done();
}

function collect(){   // built at the end so Back-and-change is reflected
 const out=[];
 order.forEach((t,k)=>{
   const a=answers[k]; if(a===undefined) return;
   if(a==='skip'){ out.push({session_code:code, trial_id:t.trial_id, preference:null,
                             skipped:true}); return; }
   out.push({session_code:code, trial_id:t.trial_id, preference:a, ms_to_respond:ms[k]});
 });
 return out;
}
function done(){
 const responses=collect();
 const nSkip=responses.filter(r=>r.skipped).length;
 const blob=new Blob([JSON.stringify({session_code:code, dry_run:true,
   generated:new Date().toISOString(), n_skipped:nSkip, responses},null,1)],
   {type:"application/json"});
 app.innerHTML=`<h2>Done</h2><div class="card">
 <p>${responses.length-nSkip} comparisons, ${nSkip} skipped.</p>
 <p><a href="${URL.createObjectURL(blob)}" download="ab_${code}.json">Download ab_${code}.json</a>
 — score with <code>scripts/mos/score_ab_session2.py</code>.</p></div>`;
}
intro();
</script></body></html>
